substitutions:
  camera_snapshot_url: !secret camera_snapshot_url

# PUBLICACAO: ajuste os entity_id de exemplo para os seus no Home Assistant.
# Nao envie secrets.yaml ao GitHub.

esphome:
  name: sunton-esp32-8048s070
  friendly_name: "Painel Sunton 7"
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"

# ============================================================
# VERSAO DO PAINEL
# ============================================================
# v1.9.1-CAMERA - 23/09/2026
# - Card CÂMERA do menu Segurança agora abre a visualização da Câmera Quintal
# - Visualização usa snapshots JPEG do go2rtc, atualizados no painel enquanto a página está aberta
# - Mantém a câmera Xiaomi apenas como status temporário até definirmos seu destino
# - Página dedicada com atualização manual e botão VOLTAR
# v1.9 - 14/09/2026
# Novo menu de Configurações, brilho automático por luminosidade, controle manual da tela, informações do sistema e atualização de dados do Home Assistant.
# Atualização baseada na v1.7.4, incorporando as mudanças da v1.7.5.
# - Gateway atualizado para a entidade de luz branca light.gateway_exemplo_light
# - Clima da HOME usa a estação meteorológica do quintal
# - Climatização reduzida para ocupar um espaço na HOME
# - Novo menu NerdMiner para monitoramento da placa de mineração/loteria
# - Ícone de carro adicionado ao card do portão da garagem
# - Barra superior ampliada com laranja, amarelo, branco, marrom, cinza, rosa, verde, dourado e vermelho
# - Correção dos IDs de Trading: taxa de acerto, total de operações e total de prejuízos
# - Menu Finanças atualizado com os indicadores corrigidos de Trading
# - Atualização do Home Assistant sincroniza também os dados de Trading
# - Aparência ampliada com seleção da cor de fundo do painel: azul escuro, preto, branco e cinza
# v1.7.4 - 24/08/2026
# Pequena atualização de estabilidade, controles e identidade visual.
# Base funcional preservada da v1.7.3-3D_Economy.
# - Controle LIGA/DESLIGA dedicado para o Gateway RGB no menu Iluminação
# - Correção do envio das cores RGB para o Gateway
# - Estado do Gateway RGB atualizado entre LIGADO e DESLIGADO
# - Histórico ampliado com v1.7.3-3D_Economy e v1.7.3-Climatização
# - Suporte ao caractere "_" nas fontes do painel
# - Solar na HOME com amarelo fixo durante geração, sem pulsação
# - Finanças na HOME com pulsação na mesma velocidade dos avisos de Segurança
# - Clima na HOME com laranja para condição térmica e cinza quando offline
# - Icones dinamicos no menu Clima para Nublado e Parcialmente Nublado
# - Icones climaticos trocados automaticamente conforme o estado do Home Assistant
# - Menu interno de Seguranca redesenhado com cards e icones dedicados
# - Alarme com icone de escudo e estado ARMADO/DESARMADO
# - Camera, porta cozinha e portao garagem com icones e estados dinamicos
# - Cores dos cards de seguranca acompanham o estado real
# - Presenca de Morador removida do menu interno para evitar duplicidade com a barra superior
# - Botoes ARMAR CASA e DESARMAR mantidos com os scripts ja funcionais
# - Menu Clima redesenhado com layout visual em cards
# - Condicao externa e temperatura em destaque no cabecalho
# - Temperatura, umidade, pressao e baterias organizadas em indicadores
# - Card de conforto do quarto com estado dinamico e cor por condicao
# - Novo menu Energia Solar em layout dedicado
# - Meta diaria baseada em 550 kWh/mes = 18,33 kWh/dia
# - Barra de progresso agora representa o cumprimento da meta diaria
# - Novo indicador de limpeza dos paineis solares integrado ao Home Assistant
# - Ultima limpeza, proxima limpeza, dias restantes e status exibidos no painel
# - Geracao atual, energia do dia e total de vida util organizados em cards
# - Indicador dinamico de status: GERANDO / BAIXA GERACAO / SISTEMA EM REPOUSO
# - Base v1.7.3-CLIMA preservada
# - Menu Bambu A1 reorganizado em cards azuis, sem barra de progresso visual.
# - Progresso da impressão exibido somente em porcentagem.
# - Card de tempo restante redesenhado para leitura limpa e sem cortes.
# - Temperaturas de bocal e mesa agrupadas em um único card, sem ícone decorativo.
# - Menu Segurança reorganizado com cards quadrados para CÂMERA, COZINHA e GARAGEM.
# - Câmera usa verde para online, vermelho para offline e cinza para indisponível.
# - Cozinha/Garagem usam verde para fechado, vermelho para aberto e cinza para indisponível.
# - Nomes dos cards de Segurança simplificados, sem textos "ABERTA/FECHADA/ONLINE" dentro dos cards.
# - Status do alarme em card separado, sem ícone.
# - Botões ARMAR e DESARMAR simplificados, sem ícones.
# - Monitoramento transformado em card retangular inferior, seguindo o padrão visual do menu Solar.
# - Menu Finanças atualizado com rentabilidade da carteira e desempenho das operações de Trading.
# - Removidos da tela financeira os dados de alocação, BTC, USD e Day Trade em R$.
# - Novo card principal de Rentabilidade da Carteira com estado e cor dinâmicos.
# - Novo card de situação financeira derivado da rentabilidade.
# - Alerta Financeiro removido por ser redundante com as cores e a situação exibidas nos cards.
# ============================================================

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:

ota:
  - platform: esphome

globals:
  - id: tema_barra_superior
    type: int
    restore_value: true
    initial_value: '0'

  - id: tema_fundo_painel
    type: int
    restore_value: true
    initial_value: '1'

  - id: brilho_auto_tela
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: brilho_manual_tela
    type: float
    restore_value: true
    initial_value: '0.80'

  # Controla a atualização da câmera apenas enquanto a página estiver aberta
  - id: camera_quintal_view_ativa
    type: bool
    restore_value: false
    initial_value: 'false'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ledc
    pin: 2
    frequency: 1220
    id: gpio_backlight_pwm

light:
  - platform: monochromatic
    name: "Brilho da Tela"
    output: gpio_backlight_pwm
    id: back_light
    restore_mode: ALWAYS_ON

# ============================================================
# CAMERA QUINTAL - snapshot do go2rtc para o painel LVGL
# O go2rtc fornece um JPEG atual da stream camera_quintal.
# homeassistant.local evita fixar o IP do servidor HA.
# ============================================================
http_request:
  timeout: 5s

online_image:
  - url: "${camera_snapshot_url}"
    format: JPEG
    type: RGB565
    resize: 360x400
    id: camera_quintal_frame
    update_interval: never
    buffer_size: 65536
    on_download_finished:
      then:
        - lvgl.image.update:
            id: img_camera_quintal_live
            src: camera_quintal_frame
        - lvgl.label.update:
            id: txt_camera_quintal_status
            text: "AO VIVO"
            text_color: 0x76FF03
    on_error:
      then:
        - lvgl.label.update:
            id: txt_camera_quintal_status
            text: "ERRO AO CARREGAR"
            text_color: 0xEF5350

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: 100ms
    dimensions:
      width: 800
      height: 480
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 42
    pclk_frequency: 12MHz
    hsync_front_porch: 210
    hsync_pulse_width: 30
    hsync_back_porch: 16
    vsync_front_porch: 22
    vsync_pulse_width: 13
    vsync_back_porch: 10
    data_pins:
      red: [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue: [15, 7, 6, 5, 4]

i2c:
  sda: 19
  scl: 20
  scan: true
  frequency: 400kHz

touchscreen:
  - platform: gt911
    id: my_touchscreen
    update_interval: 50ms
    on_touch:
      then:
        - script.execute: script_aplicar_brilho_tela
        - script.execute: timer_night_wake

time:
  - platform: homeassistant
    id: ha_time

