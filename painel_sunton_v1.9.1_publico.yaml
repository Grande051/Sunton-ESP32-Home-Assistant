script:
  - id: script_ativar_alarme
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_arm_away
          data:
            entity_id: alarm_control_panel.lumi_gateway_v3_alarm
            code: !secret alarme_code
      - logger.log:
          level: INFO
          format: "Alarme: comando ARMAR CASA (AWAY) solicitado ao Home Assistant"

  - id: script_desativar_alarme
    then:
      - homeassistant.action:
          action: alarm_control_panel.alarm_disarm
          data:
            entity_id: alarm_control_panel.lumi_gateway_v3_alarm
            code: !secret alarme_code
      - logger.log:
          level: INFO
          format: "Alarme: comando DESARMAR solicitado ao Home Assistant"

  - id: script_aplicar_brilho_tela
    mode: restart
    then:
      - lambda: |-
          float brilho = id(brilho_manual_tela);

          if (id(brilho_auto_tela) && id(iluminacao_ambiente).has_state()) {
            float lux = id(iluminacao_ambiente).state;

            if (lux < 50.0f) brilho = 0.10f;
            else if (lux < 200.0f) brilho = 0.25f;
            else if (lux < 400.0f) brilho = 0.50f;
            else if (lux < 700.0f) brilho = 0.75f;
            else brilho = 1.00f;
          }

          if (brilho < 0.01f) brilho = 0.01f;
          if (brilho > 1.00f) brilho = 1.00f;

          auto call = id(back_light).turn_on();
          call.set_brightness(brilho);
          call.perform();

  - id: script_atualizar_dados_ha
    mode: restart
    then:
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.gateway_exemplo_illumination
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.garagem_estacao_meteorologica_temperatura_externa
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.garagem_estacao_meteorologica_umidade_externa
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.solar_total_output_power
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.resultado_liquido_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.rentabilidade_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.taxa_de_acerto_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.total_de_operacoes_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.total_de_ganhos_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.total_de_prejuizos_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.day_trades
      - homeassistant.action:
          action: homeassistant.update_entity
          data:
            entity_id: sensor.swing_trades
      - logger.log:
          level: INFO
          format: "Configurações: atualização das entidades solicitada ao Home Assistant"

  - id: script_camera_quintal_atualizar
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(camera_quintal_view_ativa);'
          then:
            - component.update: camera_quintal_frame
            - delay: 1500ms

  - id: script_camera_quintal_fechar
    then:
      - lambda: 'id(camera_quintal_view_ativa) = false;'
      - script.stop: script_camera_quintal_atualizar
      - online_image.release: camera_quintal_frame

  - id: timer_night_wake
    mode: restart
    then:
      - delay: 1min
      - lambda: |-
          auto time_now = id(ha_time).now();
          if (time_now.is_valid()) {
            int hour = time_now.hour;

            // Período noturno: 22:00 até 05:00
            if (hour >= 22 || hour < 5) {
              auto call = id(back_light).turn_off();
              call.perform();
            }
          }

  - id: timer_retorno_home
    mode: restart
    then:
      - delay: 60s
      - lvgl.page.show: page_home

  - id: script_apagar_tela
    then:
      - lambda: |-
          auto call = id(back_light).turn_off();
          call.perform();

  - id: script_ativar_rgb
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: light.gateway_exemplo_light

  - id: script_desligar_luzes
    then:
      - homeassistant.action:
          action: light.turn_off
          data:
            entity_id: light.gateway_exemplo_light

      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.banheiro_switch_1

      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.escritorio_switch_1

      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.4_gang_wall_switch_switch_1

      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.4_gang_wall_switch_switch_2

      - homeassistant.action:
          action: switch.turn_off
          data:
            entity_id: switch.4_gang_wall_switch_switch_3

