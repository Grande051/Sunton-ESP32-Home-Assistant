interval:
  # ---------------------------------------------------------
  # 10s: brilho automático da tela
  # Faixas: 10% / 25% / 50% / 75% / 100%
  # ---------------------------------------------------------
  - interval: 10s
    then:
      - lambda: |-
          if (!id(brilho_auto_tela) || !id(iluminacao_ambiente).has_state()) return;

          auto time_now = id(ha_time).now();
          bool is_night = false;

          if (time_now.is_valid()) {
            is_night = (time_now.hour >= 22 || time_now.hour < 5);
          }

          // Durante o período noturno, só altera o brilho se a tela
          // estiver temporariamente ligada pelo toque.
          if (!is_night || id(timer_night_wake).is_running()) {
            id(script_aplicar_brilho_tela).execute();
          }

  # ---------------------------------------------------------
  # 1s: interface, relógio e estados rápidos
  # ---------------------------------------------------------
  # ---------------------------------------------------------
  # 1s: atualização das informações do menu Configurações
  # ---------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          char cfg_buf[180];

          if (id(wifi_ssid_painel).has_state()) {
            snprintf(cfg_buf, sizeof(cfg_buf), "REDE: %s", id(wifi_ssid_painel).state.c_str());
            lv_label_set_text(id(txt_cfg_wifi_ssid), cfg_buf);
          }

          if (id(wifi_ip_painel).has_state()) {
            snprintf(cfg_buf, sizeof(cfg_buf), "IP: %s", id(wifi_ip_painel).state.c_str());
            lv_label_set_text(id(txt_cfg_wifi_ip), cfg_buf);
          }

          if (id(wifi_rssi_painel).has_state()) {
            snprintf(cfg_buf, sizeof(cfg_buf), "SINAL: %.0f dBm", id(wifi_rssi_painel).state);
            lv_label_set_text(id(txt_cfg_wifi_rssi), cfg_buf);
          }

          if (id(uptime_painel).has_state()) {
            unsigned long up = (unsigned long) id(uptime_painel).state;
            unsigned long d = up / 86400UL;
            unsigned long h = (up % 86400UL) / 3600UL;
            unsigned long m = (up % 3600UL) / 60UL;
            snprintf(cfg_buf, sizeof(cfg_buf), "TEMPO LIGADA: %lud %02luh %02lum", d, h, m);
            lv_label_set_text(id(txt_cfg_uptime), cfg_buf);
          }

          if (id(iluminacao_ambiente).has_state()) {
            snprintf(cfg_buf, sizeof(cfg_buf), "LUMINOSIDADE: %.0f lx", id(iluminacao_ambiente).state);
            lv_label_set_text(id(txt_cfg_lux), cfg_buf);
            lv_label_set_text(id(txt_cfg_lux_tela), cfg_buf);

            float lux = id(iluminacao_ambiente).state;
            int faixa = 100;
            if (lux < 50.0f) faixa = 10;
            else if (lux < 200.0f) faixa = 25;
            else if (lux < 400.0f) faixa = 50;
            else if (lux < 700.0f) faixa = 75;
            snprintf(cfg_buf, sizeof(cfg_buf), "FAIXA AUTOMÁTICA: %d%%", faixa);
            lv_label_set_text(id(txt_cfg_faixa_auto), cfg_buf);
          }

          float brilho_atual = id(back_light).remote_values.get_brightness() * 100.0f;
          if (brilho_atual < 0.0f) brilho_atual = 0.0f;
          if (brilho_atual > 100.0f) brilho_atual = 100.0f;
          snprintf(cfg_buf, sizeof(cfg_buf), "BRILHO ATUAL: %.0f%%", brilho_atual);
          lv_label_set_text(id(txt_cfg_brilho_atual), cfg_buf);

          lv_label_set_text(id(txt_cfg_auto), id(brilho_auto_tela) ? "ATIVADO" : "MANUAL");
          lv_obj_set_style_bg_color(
            id(btn_cfg_auto),
            lv_color_hex(id(brilho_auto_tela) ? 0x2E7D32 : 0x4A4A4A),
            LV_PART_MAIN
          );

  # ---------------------------------------------------------
  # ALARME FINANCAS: independente da pulsacao da SEGURANCA
  # Patrimonio/rentabilidade negativa = vermelho pulsante.
  # ---------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          static bool pulse_financas = false;
          pulse_financas = !pulse_financas;

          if (!id(pat_rentabilidade).has_state()) {
            lv_obj_set_style_bg_color(
              id(btn_home_financas),
              lv_color_hex(0x607D8B),
              LV_PART_MAIN
            );
            return;
          }

          float rent_fin = id(pat_rentabilidade).state;

          if (rent_fin < -0.001f) {
            lv_obj_set_style_bg_color(
              id(btn_home_financas),
              lv_color_hex(pulse_financas ? 0xE53935 : 0xB71C1C),
              LV_PART_MAIN
            );
          } else if (rent_fin > 0.001f) {
            lv_obj_set_style_bg_color(
              id(btn_home_financas),
              lv_color_hex(0x2E7D32),
              LV_PART_MAIN
            );
          } else {
            lv_obj_set_style_bg_color(
              id(btn_home_financas),
              lv_color_hex(0x546E7A),
              LV_PART_MAIN
            );
          }

  - interval: 1s
    then:
      - lambda: |-
          char buf[160];

          auto time_now = id(ha_time).now();

          if (time_now.is_valid()) {
            const char* dias[] = {"DOM","SEG","TER","QUA","QUI","SEX","SAB"};
            int dow = time_now.day_of_week - 1;
            if (dow < 0 || dow > 6) dow = 0;

            snprintf(buf, sizeof(buf),
              "%s, %02d/%02d - %02d:%02d",
              dias[dow],
              time_now.day_of_month,
              time_now.month,
              time_now.hour,
              time_now.minute
            );

            lv_label_set_text(id(txt_header_relogio), buf);

            bool is_night = (time_now.hour >= 22 || time_now.hour < 5);

            if (!is_night) {
              if (id(back_light).remote_values.get_brightness() == 0.0f) {
                id(script_aplicar_brilho_tela).execute();
              }
            } else {
              if (!id(timer_night_wake).is_running() &&
                  id(back_light).remote_values.get_brightness() > 0.0f) {
                auto call = id(back_light).turn_off();
                call.perform();
              }
            }
          }


          // ---------- HEADER / TEMA GLOBAL ----------
          uint32_t cor_barra = 0x1E88E5;

          if (id(tema_barra_superior) == 1) {
            cor_barra = 0x8E24AA;
          } else if (id(tema_barra_superior) == 2) {
            cor_barra = 0x111111;
          } else if (id(tema_barra_superior) == 3) {
            cor_barra = 0xF57C00;
          } else if (id(tema_barra_superior) == 4) {
            cor_barra = 0xFBC02D;
          } else if (id(tema_barra_superior) == 5) {
            cor_barra = 0xFFFFFF;
          } else if (id(tema_barra_superior) == 6) {
            cor_barra = 0x795548;
          } else if (id(tema_barra_superior) == 7) {
            cor_barra = 0x757575;
          } else if (id(tema_barra_superior) == 8) {
            cor_barra = 0xE91E63;
          } else if (id(tema_barra_superior) == 9) {
            cor_barra = 0x43A047;
          } else if (id(tema_barra_superior) == 10) {
            cor_barra = 0xD4AF37;
          } else if (id(tema_barra_superior) == 11) {
            cor_barra = 0xE53935;
          }

          lv_obj_set_style_bg_color(
            id(top_layer),
            lv_color_hex(cor_barra),
            LV_PART_MAIN
          );

          std::string rob =
            id(pessoa_morador).has_state() ? id(pessoa_morador).state : "--";

          if (rob == "home") rob = "CASA";
          else if (rob == "not_home") rob = "FORA";
          else if (rob == "away") rob = "FORA";

          float bat_s22 =
            id(s22_bateria).has_state() ? id(s22_bateria).state : -1.0f;

          std::string bat_estado =
            id(s22_status_bateria).has_state() ? id(s22_status_bateria).state : "";

          const char* bat_texto = "";
          if (bat_estado == "charging") {
            bat_texto = "CARREGANDO";
          } else if (bat_estado == "discharging") {
            bat_texto = "DESCARREGANDO";
          } else if (bat_estado == "full") {
            bat_texto = "BATERIA CHEIA";
          } else if (bat_estado == "not_charging") {
            bat_texto = "CONECTADA";
          } else if (!bat_estado.empty()) {
            bat_texto = bat_estado.c_str();
          } else {
            bat_texto = "--";
          }

          snprintf(buf, sizeof(buf), "Morador: %s", rob.c_str());
          lv_label_set_text(id(txt_header_user_info), buf);

          if (bat_s22 >= 0) {
            snprintf(buf, sizeof(buf), "S22: %.0f%%", bat_s22);
            lv_label_set_text(id(txt_header_battery), buf);

            if (bat_s22 >= 60.0f) {
              lv_obj_set_style_text_color(
                id(txt_header_battery),
                lv_color_hex(0x76FF03),
                LV_PART_MAIN
              );
            } else if (bat_s22 >= 30.0f) {
              lv_obj_set_style_text_color(
                id(txt_header_battery),
                lv_color_hex(0xFFC107),
                LV_PART_MAIN
              );
            } else {
              lv_obj_set_style_text_color(
                id(txt_header_battery),
                lv_color_hex(0xEF5350),
                LV_PART_MAIN
              );
            }
          } else {
            lv_label_set_text(id(txt_header_battery), "S22: --%");
            lv_obj_set_style_text_color(
              id(txt_header_battery),
              lv_color_hex(0x90A4AE),
              LV_PART_MAIN
            );
          }

          lv_label_set_text(id(txt_header_battery_status), bat_texto);

          if (bat_estado == "charging") {
            lv_obj_set_style_text_color(
              id(txt_header_battery_status),
              lv_color_hex(0x76FF03),
              LV_PART_MAIN
            );
          } else if (bat_estado == "discharging") {
            lv_obj_set_style_text_color(
              id(txt_header_battery_status),
              lv_color_hex(0xFFC107),
              LV_PART_MAIN
            );
          } else if (bat_estado == "full") {
            lv_obj_set_style_text_color(
              id(txt_header_battery_status),
              lv_color_hex(0x42A5F5),
              LV_PART_MAIN
            );
          } else {
            lv_obj_set_style_text_color(
              id(txt_header_battery_status),
              lv_color_hex(0xE0E0E0),
              LV_PART_MAIN
            );
          }

          // ---------- SELEÇÃO VISUAL DO TEMA ----------
          lv_obj_set_style_border_width(
            id(btn_tema_azul),
            id(tema_barra_superior) == 0 ? 3 : 1,
            LV_PART_MAIN
          );
          lv_obj_set_style_border_color(
            id(btn_tema_azul),
            id(tema_barra_superior) == 0 ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x1976D2),
            LV_PART_MAIN
          );

          lv_obj_set_style_border_width(
            id(btn_tema_roxo),
            id(tema_barra_superior) == 1 ? 3 : 1,
            LV_PART_MAIN
          );
          lv_obj_set_style_border_color(
            id(btn_tema_roxo),
            id(tema_barra_superior) == 1 ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x1976D2),
            LV_PART_MAIN
          );

          lv_obj_set_style_border_width(
            id(btn_tema_preto),
            id(tema_barra_superior) == 2 ? 3 : 1,
            LV_PART_MAIN
          );
          lv_obj_set_style_border_color(
            id(btn_tema_preto),
            id(tema_barra_superior) == 2 ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x1976D2),
            LV_PART_MAIN
          );

          // ---------- PORTAS ----------
          static bool pulse = false;
          pulse = !pulse;

          bool p_quarto =
            id(porta_quarto).has_state() && id(porta_quarto).state;

          bool p_social =
            id(portao_social).has_state() && id(portao_social).state;

          bool p_jardim =
            id(porta_jardim_inverno).has_state() && id(porta_jardim_inverno).state;

          bool p_cozinha =
            id(porta_cozinha).has_state() && id(porta_cozinha).state;

          bool p_sala =
            id(porta_sala).has_state() && id(porta_sala).state;

          if (p_social) {
            lv_obj_set_style_bg_color(
              id(card_porta_quarto),
              lv_color_hex(pulse ? 0xE53935 : 0xB71C1C),
              LV_PART_MAIN
            );
            lv_label_set_text(id(txt_home_porta_quarto), "ATENÇÃO: PORTÃO SOCIAL ABERTO");
          } else {
            lv_obj_set_style_bg_color(
              id(card_porta_quarto),
              lv_color_hex(0x2E7D32),
              LV_PART_MAIN
            );
            lv_label_set_text(id(txt_home_porta_quarto), "PORTÃO SOCIAL: FECHADO");
          }

          bool p_garagem =
            id(portao_garagem).has_state() && id(portao_garagem).state;

          if (p_garagem) {
            lv_obj_set_style_bg_color(
              id(card_portao_garagem),
              lv_color_hex(pulse ? 0xE53935 : 0xB71C1C),
              LV_PART_MAIN
            );
            lv_label_set_text(
              id(txt_home_portao_garagem),
              "ATENÇÃO: PORTÃO ABERTO"
            );
          } else {
            lv_obj_set_style_bg_color(
              id(card_portao_garagem),
              lv_color_hex(0x2E7D32),
              LV_PART_MAIN
            );
            lv_label_set_text(
              id(txt_home_portao_garagem),
              "PORTÃO GARAGEM: FECHADO"
            );
          }

          // ---------- SEGURANCA ----------
          std::string st_alm =
            id(status_alarme).has_state() ? id(status_alarme).state : "--";

          bool alarme_ok =
            st_alm == "armed_home" ||
            st_alm == "armed_away";

          bool casa_segura =
            !p_quarto && !p_social && !p_jardim && !p_cozinha && !p_sala && !p_garagem && (alarme_ok || st_alm == "disarmed");

          if (p_quarto || p_social || p_jardim || p_cozinha || p_sala || p_garagem) {
            lv_obj_set_style_bg_color(
              id(btn_home_seguranca),
              lv_color_hex(pulse ? 0xE53935 : 0xB71C1C),
              LV_PART_MAIN
            );
            lv_label_set_text(
              id(txt_home_seguranca),
              "SEGURANÇA\nATENÇÃO!"
            );
          } else if (alarme_ok) {
            lv_obj_set_style_bg_color(
              id(btn_home_seguranca),
              lv_color_hex(0x1565C0),
              LV_PART_MAIN
            );
            lv_label_set_text(
              id(txt_home_seguranca),
              "SEGURANÇA\nALARME ARMADO"
            );
          } else {
            lv_obj_set_style_bg_color(
              id(btn_home_seguranca),
              lv_color_hex(0x2E7D32),
              LV_PART_MAIN
            );
            lv_label_set_text(
              id(txt_home_seguranca),
              "SEGURANÇA\nCASA SEGURA"
            );
          }

          // ---------- SOLAR ----------
          float s_act =
            id(solar_atual).has_state() ? id(solar_atual).state : -1.0f;

          if (s_act >= 0) {
            snprintf(buf, sizeof(buf), "SOLAR\n%.0f W", s_act);
            lv_label_set_text(id(txt_home_solar), buf);

            if (s_act > 50) {
              lv_obj_set_style_bg_color(
                id(btn_home_solar),
                lv_color_hex(0xFFB300),
                LV_PART_MAIN
              );
              lv_label_set_text(id(txt_solar_status), "Status: GERANDO");
            } else {
              lv_obj_set_style_bg_color(
                id(btn_home_solar),
                lv_color_hex(0x546E7A),
                LV_PART_MAIN
              );
              lv_label_set_text(id(txt_solar_status), "Status: BAIXA GERACAO");
            }
          } else {
            lv_label_set_text(id(txt_home_solar), "SOLAR\n-- W");
            lv_label_set_text(id(txt_solar_status), "Status: OFFLINE");
          }

          // ---------- IMPRESSORA ----------
          float b_prog =
            id(bambu_progresso).has_state() ? id(bambu_progresso).state : -1.0f;

          std::string b_st =
            id(bambu_status).has_state() ? id(bambu_status).state : "--";

          if (b_prog >= 0) {
            snprintf(buf, sizeof(buf), "BAMBU A1\n%.0f%%", b_prog);
            lv_label_set_text(id(txt_home_impressora), buf);

          } else {
            lv_label_set_text(id(txt_home_impressora), "BAMBU A1\n--%");
          }

          if (b_st == "failed" || b_st == "error") {
            lv_obj_set_style_bg_color(
              id(btn_home_impressora),
              lv_color_hex(pulse ? 0xE53935 : 0xB71C1C),
              LV_PART_MAIN
            );
          } else if (b_st == "printing" || b_st == "running") {
            lv_obj_set_style_bg_color(
              id(btn_home_impressora),
              lv_color_hex(0x1976D2),
              LV_PART_MAIN
            );
          } else if (b_st == "finished") {
            lv_obj_set_style_bg_color(
              id(btn_home_impressora),
              lv_color_hex(0x2E7D32),
              LV_PART_MAIN
            );
          } else {
            lv_obj_set_style_bg_color(
              id(btn_home_impressora),
              lv_color_hex(0x546E7A),
              LV_PART_MAIN
            );
          }

          // ---------- FINANCAS ----------
          float p_rent =
            id(pat_rentabilidade).has_state() ? id(pat_rentabilidade).state : 0.0f;
          bool rent_ok = id(pat_rentabilidade).has_state();

          // FINANCAS: nao exibe patrimonio/valores de carteira na tela inicial.
          if (rent_ok) {
            snprintf(buf, sizeof(buf), "FINANÇAS\n%+.2f%%\nRENTABILIDADE", p_rent);
            lv_label_set_text(id(txt_home_financas), buf);
          } else {
            lv_label_set_text(id(txt_home_financas), "FINANÇAS\nOFFLINE");
          }

          // A cor/alarme das FINANCAS é controlada por um intervalo
          // independente mais abaixo, para não sincronizar com a segurança.

          // ---------- CLIMA DO QUINTAL ----------
          float tq_home =
            id(temp_quintal).has_state() ? id(temp_quintal).state : -1.0f;
          float uq_home =
            id(umid_quintal).has_state() ? id(umid_quintal).state : -1.0f;

          if (tq_home >= 0) {
            const char* conforto_home = "CONFORTÁVEL";
            if (tq_home < 21.0f) conforto_home = "FRIO";
            else if (tq_home > 27.0f) conforto_home = "QUENTE";
            else if (uq_home >= 0 && uq_home < 40.0f) conforto_home = "SECO";
            else if (uq_home > 70.0f) conforto_home = "ÚMIDO";

            if (uq_home >= 0) {
              snprintf(buf, sizeof(buf), "CLIMA\n%.1f°C | %.0f%%\n%s", tq_home, uq_home, conforto_home);
            } else {
              snprintf(buf, sizeof(buf), "CLIMA\n%.1f°C\n%s", tq_home, conforto_home);
            }
            lv_label_set_text(id(txt_home_clima), buf);

            if (tq_home < 21.0f) {
              lv_obj_set_style_bg_color(id(btn_home_clima), lv_color_hex(0x1976D2), LV_PART_MAIN);
            } else if (tq_home > 27.0f) {
              lv_obj_set_style_bg_color(id(btn_home_clima), lv_color_hex(0xEF6C00), LV_PART_MAIN);
            } else if (uq_home >= 0 && uq_home < 40.0f) {
              lv_obj_set_style_bg_color(id(btn_home_clima), lv_color_hex(0xFFC107), LV_PART_MAIN);
            } else if (uq_home > 70.0f) {
              lv_obj_set_style_bg_color(id(btn_home_clima), lv_color_hex(0x7E57C2), LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(id(btn_home_clima), lv_color_hex(0x00897B), LV_PART_MAIN);
            }
          } else {
            lv_label_set_text(id(txt_home_clima), "CLIMA\nOFFLINE");
            lv_obj_set_style_bg_color(id(btn_home_clima), lv_color_hex(0x546E7A), LV_PART_MAIN);
          }

          // ---------- ILUMINACAO ----------
          int luzes_on = 0;

          if (id(estado_luz_rgb).has_state() &&
              id(estado_luz_rgb).state == "on") luzes_on++;

          if (id(estado_luz_banheiro).has_state() &&
              id(estado_luz_banheiro).state == "on") luzes_on++;

          if (id(estado_luz_escritorio).has_state() &&
              id(estado_luz_escritorio).state == "on") luzes_on++;

          if (id(estado_cozinha).has_state() &&
              id(estado_cozinha).state == "on") luzes_on++;

          if (id(estado_varanda_interna).has_state() &&
              id(estado_varanda_interna).state == "on") luzes_on++;

          if (id(estado_varanda_externa).has_state() &&
              id(estado_varanda_externa).state == "on") luzes_on++;

          snprintf(buf, sizeof(buf), "ILUMINAÇÃO\n%d LIGADAS", luzes_on);
          lv_label_set_text(id(txt_home_iluminacao), buf);

          lv_obj_set_style_bg_color(
            id(btn_home_iluminacao),
            lv_color_hex(luzes_on > 0 ? 0xFFC107 : 0x546E7A),
            LV_PART_MAIN
          );

          // ---------- VENTILADORES ----------
          bool fan_sala =
            id(estado_fan_sala).has_state() &&
            id(estado_fan_sala).state == "on";

          bool fan_quarto =
            id(estado_fan_quarto).has_state() &&
            id(estado_fan_quarto).state == "on";

          // Mostra tambem a potencia atual dos ventiladores na Home.
          float pct_sala_home = 0.0f;
          float pct_quarto_home = 0.0f;

          if (id(fan_sala_percent).has_state()) {
            pct_sala_home = atof(id(fan_sala_percent).state.c_str());
          }
          if (id(fan_quarto_percent).has_state()) {
            pct_quarto_home = atof(id(fan_quarto_percent).state.c_str());
          }

          if (pct_sala_home < 0) pct_sala_home = 0;
          if (pct_sala_home > 100) pct_sala_home = 100;
          if (pct_quarto_home < 0) pct_quarto_home = 0;
          if (pct_quarto_home > 100) pct_quarto_home = 100;

          char sala_pct_home[16];
          char quarto_pct_home[16];

          if (fan_sala) {
            snprintf(sala_pct_home, sizeof(sala_pct_home), "ON %.0f%%", pct_sala_home);
          } else {
            snprintf(sala_pct_home, sizeof(sala_pct_home), "OFF --");
          }

          if (fan_quarto) {
            snprintf(quarto_pct_home, sizeof(quarto_pct_home), "ON %.0f%%", pct_quarto_home);
          } else {
            snprintf(quarto_pct_home, sizeof(quarto_pct_home), "OFF --");
          }

          snprintf(buf, sizeof(buf),
            "CLIMATIZAÇÃO\nSALA: %s   QUARTO: %s",
            sala_pct_home,
            quarto_pct_home
          );

          lv_label_set_text(id(txt_home_climatizacao), buf);

          if (fan_sala || fan_quarto) {
            lv_obj_set_style_bg_color(id(btn_home_climatizacao), lv_color_hex(0x1976D2), LV_PART_MAIN);
          } else {
            lv_obj_set_style_bg_color(id(btn_home_climatizacao), lv_color_hex(0x546E7A), LV_PART_MAIN);
          }

          // ---------- PAGINA SEGURANCA ----------
          // st_alm, alarme_ok, p_quarto e p_garagem já foram
          // declarados anteriormente nesta mesma lambda e são reutilizados aqui.

          if (st_alm == "disarmed") {
            lv_label_set_text(id(txt_status_alarme), "ALARME: DESARMADO");
            lv_label_set_text(id(txt_status_alarme_card), "DESARMADO");
            lv_obj_set_style_text_color(id(txt_status_alarme), lv_color_hex(0x76FF03), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(card_status_alarme), lv_color_hex(0x0B2745), LV_PART_MAIN);
          } else if (alarme_ok) {
            lv_label_set_text(id(txt_status_alarme), "ALARME: ARMADO");
            lv_label_set_text(id(txt_status_alarme_card), "ARMADO");
            lv_obj_set_style_text_color(id(txt_status_alarme), lv_color_hex(0x42A5F5), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(card_status_alarme), lv_color_hex(0x0B2745), LV_PART_MAIN);
          } else {
            snprintf(buf, sizeof(buf), "ALARME: %s", st_alm.c_str());
            lv_label_set_text(id(txt_status_alarme), buf);
            lv_label_set_text(id(txt_status_alarme_card), st_alm.c_str());
            lv_obj_set_style_text_color(id(txt_status_alarme), lv_color_hex(0x90A4AE), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(card_status_alarme), lv_color_hex(0x455A64), LV_PART_MAIN);
          }

          std::string st_cam =
            id(status_camera).has_state() ? id(status_camera).state : "";

          if (st_cam == "idle" || st_cam == "recording" || st_cam == "streaming") {
            lv_label_set_text(id(txt_status_camera), "CÂMERA");
            lv_obj_set_style_bg_color(id(card_status_camera), lv_color_hex(0x2E7D32), LV_PART_MAIN);
          } else if (st_cam.empty() || st_cam == "unknown" || st_cam == "unavailable") {
            lv_label_set_text(id(txt_status_camera), "CÂMERA");
            lv_obj_set_style_bg_color(id(card_status_camera), lv_color_hex(0x546E7A), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(txt_status_camera), "CÂMERA");
            lv_obj_set_style_bg_color(id(card_status_camera), lv_color_hex(0xD32F2F), LV_PART_MAIN);
          }

          bool quarto_online = id(porta_quarto).has_state();
          bool social_online = id(portao_social).has_state();
          bool jardim_online = id(porta_jardim_inverno).has_state();
          bool cozinha_online = id(porta_cozinha).has_state();
          bool sala_online = id(porta_sala).has_state();
          bool garagem_online = id(portao_garagem).has_state();

          auto atualiza_porta = [&](const char* nome, bool online, bool aberta, lv_obj_t* card, lv_obj_t* label) {
            if (!online) {
              lv_label_set_text(label, "OFFLINE");
              lv_obj_set_style_bg_color(card, lv_color_hex(0x546E7A), LV_PART_MAIN);
            } else if (aberta) {
              lv_label_set_text(label, nome);
              lv_obj_set_style_bg_color(card, lv_color_hex(pulse ? 0xE53935 : 0xB71C1C), LV_PART_MAIN);
            } else {
              lv_label_set_text(label, nome);
              lv_obj_set_style_bg_color(card, lv_color_hex(0x2E7D32), LV_PART_MAIN);
            }
          };

          atualiza_porta("QUARTO", quarto_online, p_quarto, id(card_status_porta_quarto), id(txt_seg_porta_quarto));
          atualiza_porta("SOCIAL", social_online, p_social, id(card_status_portao_social), id(txt_seg_portao_social));
          atualiza_porta("JARDIM INVERNO", jardim_online, p_jardim, id(card_status_porta_jardim), id(txt_seg_porta_jardim));
          atualiza_porta("COZINHA", cozinha_online, p_cozinha, id(card_status_porta_cozinha), id(txt_seg_porta_cozinha));
          atualiza_porta("SALA", sala_online, p_sala, id(card_status_porta_sala), id(txt_seg_porta_sala));
          atualiza_porta("GARAGEM", garagem_online, p_garagem, id(card_status_portao_garagem), id(txt_seg_portao_garagem));

          int portas_abertas = (quarto_online && p_quarto) + (social_online && p_social) +
                               (jardim_online && p_jardim) + (cozinha_online && p_cozinha) +
                               (sala_online && p_sala) + (garagem_online && p_garagem);

          const char* alarme_txt = alarme_ok ? "armado" : (st_alm == "disarmed" ? "desarmado" : "indisponível");
          snprintf(buf, sizeof(buf), "Portas abertas: %d  |  Alarme: %s", portas_abertas, alarme_txt);
          lv_label_set_text(id(txt_seg_resumo), buf);
          lv_obj_set_style_text_color(id(txt_seg_resumo), lv_color_hex(0xFFFFFF), LV_PART_MAIN);

          // ---------- PAGINA SOLAR ----------
          // Meta contratada: 550 kWh/mes = 18,33 kWh/dia.
          const float meta_solar_dia = 18.33f;

          float solar_dia =
            id(solar_hoje).has_state() ? id(solar_hoje).state : -1.0f;

          float solar_total =
            id(solar_vida_util).has_state() ? id(solar_vida_util).state : -1.0f;

          if (solar_dia >= 0.0f) {
            snprintf(buf, sizeof(buf), "%.2f kWh", solar_dia);
            lv_label_set_text(id(txt_detalhe_solar_hoje), buf);

            float pct_meta = (solar_dia / meta_solar_dia) * 100.0f;
            if (pct_meta < 0.0f) pct_meta = 0.0f;
            if (pct_meta > 100.0f) pct_meta = 100.0f;

            snprintf(buf, sizeof(buf), "%.0f%%", pct_meta);
            lv_label_set_text(id(txt_solar_meta_pct), buf);
          } else {
            lv_label_set_text(id(txt_detalhe_solar_hoje), "--,-- kWh");
            lv_label_set_text(id(txt_solar_meta_pct), "--%");
            lv_label_set_text(id(txt_solar_meta_pct), "--%");
          }

          if (solar_total >= 0.0f) {
            snprintf(buf, sizeof(buf), "%.2f kWh", solar_total);
            lv_label_set_text(id(txt_detalhe_solar_total), buf);
          } else {
            lv_label_set_text(id(txt_detalhe_solar_total), "--,-- kWh");
          }

          if (s_act >= 0) {
            snprintf(buf, sizeof(buf), "%.0f W", s_act);
            lv_label_set_text(id(txt_detalhe_solar_atual), buf);

            if (s_act > 100.0f) {
              lv_label_set_text(id(txt_solar_status), "SISTEMA GERANDO");
              lv_obj_set_style_text_color(
                id(txt_solar_status),
                lv_color_hex(0x76FF03),
                LV_PART_MAIN
              );
            } else if (s_act > 10.0f) {
              lv_label_set_text(id(txt_solar_status), "BAIXA GERACAO");
              lv_obj_set_style_text_color(
                id(txt_solar_status),
                lv_color_hex(0xFFC107),
                LV_PART_MAIN
              );
            } else {
              lv_label_set_text(id(txt_solar_status), "SISTEMA EM REPOUSO");
              lv_obj_set_style_text_color(
                id(txt_solar_status),
                lv_color_hex(0x42A5F5),
                LV_PART_MAIN
              );
            }
          } else {
            lv_label_set_text(id(txt_detalhe_solar_atual), "-- W");
            lv_label_set_text(id(txt_solar_status), "SEM DADOS");
            lv_obj_set_style_text_color(
              id(txt_solar_status),
              lv_color_hex(0x90A4AE),
              LV_PART_MAIN
            );
          }

          // ---------- LIMPEZA DOS PAINEIS SOLARES ----------
          // Formata datas vindas do Google Sheets/HA como DD/MM/AAAA.

          std::string ultima_limpeza_raw =
            id(solar_ultima_limpeza).has_state()
              ? id(solar_ultima_limpeza).state
              : "";

          std::string proxima_limpeza_raw =
            id(solar_proxima_limpeza).has_state()
              ? id(solar_proxima_limpeza).state
              : "";

          auto formatar_data = [](const std::string &data) -> std::string {
            if (data.length() >= 10 &&
                data[4] == '-' &&
                data[7] == '-') {
              return data.substr(8, 2) + "/" +
                     data.substr(5, 2) + "/" +
                     data.substr(0, 4);
            }

            if (data.length() >= 10 &&
                data[2] == '/' &&
                data[5] == '/') {
              return data.substr(0, 10);
            }

            return "--/--/----";
          };

          std::string ultima_limpeza =
            ultima_limpeza_raw.empty()
              ? "--/--/----"
              : formatar_data(ultima_limpeza_raw);

          std::string proxima_limpeza =
            proxima_limpeza_raw.empty()
              ? "--/--/----"
              : formatar_data(proxima_limpeza_raw);

          char limpeza_buf[40];

          snprintf(
            limpeza_buf,
            sizeof(limpeza_buf),
            "Última: %s",
            ultima_limpeza.c_str()
          );
          lv_label_set_text(id(txt_solar_ultima_label), limpeza_buf);

          snprintf(
            limpeza_buf,
            sizeof(limpeza_buf),
            "Próxima: %s",
            proxima_limpeza.c_str()
          );
          lv_label_set_text(id(txt_solar_proxima_label), limpeza_buf);

          int dias_limpeza = 0;
          bool tem_dias_limpeza = id(solar_dias_limpeza).has_state();

          if (tem_dias_limpeza) {
            dias_limpeza = (int)roundf(id(solar_dias_limpeza).state);
          }

          if (tem_dias_limpeza) {
            if (dias_limpeza < 0) {
              snprintf(buf, sizeof(buf), "(%02d dias)", abs(dias_limpeza));
              lv_label_set_text(id(txt_solar_limpeza_status), buf);
              lv_obj_set_style_text_color(
                id(txt_solar_limpeza_status),
                lv_color_hex(0xFF5252),
                LV_PART_MAIN
              );
            } else if (dias_limpeza <= 30) {
              snprintf(buf, sizeof(buf), "(%02d dias)", dias_limpeza);
              lv_label_set_text(id(txt_solar_limpeza_status), buf);
              lv_obj_set_style_text_color(
                id(txt_solar_limpeza_status),
                lv_color_hex(0xFFC107),
                LV_PART_MAIN
              );
            } else {
              snprintf(buf, sizeof(buf), "(%02d dias)", dias_limpeza);
              lv_label_set_text(id(txt_solar_limpeza_status), buf);
              lv_obj_set_style_text_color(
                id(txt_solar_limpeza_status),
                lv_color_hex(0x76FF03),
                LV_PART_MAIN
              );
            }
          } else {
            lv_label_set_text(id(txt_solar_limpeza_status), "(-- dias)");
            lv_obj_set_style_text_color(
              id(txt_solar_limpeza_status),
              lv_color_hex(0x90A4AE),
              LV_PART_MAIN
            );
          }

          // ---------- PAGINA IMPRESSORA ----------
          std::string projeto =
            id(bambu_nome_projeto).has_state()
              ? id(bambu_nome_projeto).state
              : "--";

          lv_label_set_text(id(txt_detalhe_3d_projeto), projeto.c_str());

          std::string b_st_display = b_st;
          if (b_st_display == "running") b_st_display = "RUNNING";
          else if (b_st_display == "printing") b_st_display = "PRINTING";
          else if (b_st_display == "finished") b_st_display = "FINISHED";
          else if (b_st_display == "failed") b_st_display = "FAILED";
          lv_label_set_text(id(txt_detalhe_3d_status), b_st_display.c_str());

          if (b_st == "failed" || b_st == "error") {
            lv_obj_set_style_text_color(id(txt_detalhe_3d_status), lv_color_hex(0xFF5252), LV_PART_MAIN);
          } else if (b_st == "printing" || b_st == "running") {
            lv_obj_set_style_text_color(id(txt_detalhe_3d_status), lv_color_hex(0x76FF03), LV_PART_MAIN);
          } else {
            lv_obj_set_style_text_color(id(txt_detalhe_3d_status), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
          }

          if (b_prog >= 0) {
            snprintf(buf, sizeof(buf), "%.0f%%", b_prog);
            lv_label_set_text(id(txt_detalhe_3d_progresso), buf);
          } else {
            lv_label_set_text(id(txt_detalhe_3d_progresso), "--%");
          }

          std::string tempo =
            id(bambu_tempo_restante).has_state()
              ? id(bambu_tempo_restante).state
              : "--";

          lv_label_set_text(id(txt_detalhe_3d_tempo), tempo.c_str());

          float b_bocal_at =
            id(bambu_temp_bocal_atual).has_state()
              ? id(bambu_temp_bocal_atual).state : -1.0f;

          float b_bocal_tg =
            id(bambu_temp_bocal_target).has_state()
              ? id(bambu_temp_bocal_target).state : -1.0f;

          snprintf(buf, sizeof(buf),
            "Bocal: %.0f / %.0f C",
            b_bocal_at,
            b_bocal_tg
          );
          lv_label_set_text(id(txt_detalhe_3d_bocal), buf);

          float b_mesa_at =
            id(bambu_temp_mesa_atual).has_state()
              ? id(bambu_temp_mesa_atual).state : -1.0f;

          float b_mesa_tg =
            id(bambu_temp_mesa_target).has_state()
              ? id(bambu_temp_mesa_target).state : -1.0f;

          snprintf(buf, sizeof(buf),
            "Mesa: %.0f / %.0f C",
            b_mesa_at,
            b_mesa_tg
          );
          lv_label_set_text(id(txt_detalhe_3d_mesa), buf);

          // ---------- PAGINA FINANCAS ----------
          // Rentabilidade da carteira + desempenho das operações.
          // Sem patrimonio, saldos ou cotacoes.
          if (id(pat_rentabilidade).has_state()) {
            float rent = id(pat_rentabilidade).state;

            if (!std::isfinite(rent)) {
              lv_label_set_text(id(txt_fin_rentabilidade), "--%");
              lv_obj_add_flag(id(img_fin_status_up), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(img_fin_status_down), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(img_fin_status_right), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_text_color(id(txt_fin_rentabilidade), lv_color_hex(0x90A4AE), LV_PART_MAIN);
            } else {
              snprintf(buf, sizeof(buf), "%+.2f%%", rent);
              lv_label_set_text(id(txt_fin_rentabilidade), buf);

              if (rent < -0.001f) {
                lv_obj_set_style_text_color(id(txt_fin_rentabilidade), lv_color_hex(0xEF5350), LV_PART_MAIN);
                lv_obj_add_flag(id(img_fin_status_up), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(img_fin_status_down), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(img_fin_status_right), LV_OBJ_FLAG_HIDDEN);
              } else if (rent > 0.001f) {
                lv_obj_set_style_text_color(id(txt_fin_rentabilidade), lv_color_hex(0x66BB6A), LV_PART_MAIN);
                lv_obj_clear_flag(id(img_fin_status_up), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(img_fin_status_down), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(img_fin_status_right), LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_set_style_text_color(id(txt_fin_rentabilidade), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                lv_obj_add_flag(id(img_fin_status_up), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(img_fin_status_down), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(img_fin_status_right), LV_OBJ_FLAG_HIDDEN);
              }
            }
          } else {
            lv_label_set_text(id(txt_fin_rentabilidade), "--%");
            lv_obj_add_flag(id(img_fin_status_up), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(img_fin_status_down), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(img_fin_status_right), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_text_color(id(txt_fin_rentabilidade), lv_color_hex(0x90A4AE), LV_PART_MAIN);
          }

          // ---------- TRADING ----------
          float resultado_trades_val =
            id(resultado_trades).has_state() ? id(resultado_trades).state : NAN;
          float rent_trades_val =
            id(rentabilidade_trades).has_state() ? id(rentabilidade_trades).state : NAN;
          float acerto_trades_val =
            id(taxa_acerto_trades).has_state() ? id(taxa_acerto_trades).state : NAN;

          auto formatar_moeda = [](float valor) -> std::string {
            char tmp[32];
            snprintf(tmp, sizeof(tmp), "%.2f", fabsf(valor));
            std::string s = tmp;
            size_t ponto = s.find('.');
            std::string inteiro = ponto != std::string::npos ? s.substr(0, ponto) : s;
            std::string centavos = ponto != std::string::npos ? s.substr(ponto + 1) : "00";

            for (int i = (int)inteiro.length() - 3; i > 0; i -= 3) {
              inteiro.insert(i, ".");
            }

            return std::string(valor >= 0 ? "+R$ " : "-R$ ") + inteiro + "," + centavos;
          };

          if (std::isfinite(resultado_trades_val)) {
            std::string resultado_txt = formatar_moeda(resultado_trades_val);
            lv_label_set_text(id(txt_fin_resultado_trades), resultado_txt.c_str());
            lv_obj_set_style_text_color(
              id(txt_fin_resultado_trades),
              lv_color_hex(resultado_trades_val >= 0 ? 0x66BB6A : 0xEF5350),
              LV_PART_MAIN
            );
          } else {
            lv_label_set_text(id(txt_fin_resultado_trades), "--");
            lv_obj_set_style_text_color(id(txt_fin_resultado_trades), lv_color_hex(0x90A4AE), LV_PART_MAIN);
          }

          if (std::isfinite(rent_trades_val)) {
            snprintf(buf, sizeof(buf), "%+.2f%%", rent_trades_val);
            lv_label_set_text(id(txt_fin_rent_trades), buf);
            lv_obj_set_style_text_color(
              id(txt_fin_rent_trades),
              lv_color_hex(rent_trades_val >= 0 ? 0x66BB6A : 0xEF5350),
              LV_PART_MAIN
            );
          } else {
            lv_label_set_text(id(txt_fin_rent_trades), "--%");
            lv_obj_set_style_text_color(id(txt_fin_rent_trades), lv_color_hex(0x90A4AE), LV_PART_MAIN);
          }

          if (std::isfinite(acerto_trades_val)) {
            snprintf(buf, sizeof(buf), "%.2f%%", acerto_trades_val);
            lv_label_set_text(id(txt_fin_acerto_trades), buf);
            lv_obj_set_style_text_color(
              id(txt_fin_acerto_trades),
              lv_color_hex(acerto_trades_val >= 50.0f ? 0x66BB6A : 0xEF5350),
              LV_PART_MAIN
            );
          } else {
            lv_label_set_text(id(txt_fin_acerto_trades), "--%");
            lv_obj_set_style_text_color(id(txt_fin_acerto_trades), lv_color_hex(0x90A4AE), LV_PART_MAIN);
          }

          // ---------- ESTATISTICAS DE TRADING ----------
          auto mostrar_inteiro = [](lv_obj_t *label, float valor) {
            char tmp[16];
            if (std::isfinite(valor)) {
              snprintf(tmp, sizeof(tmp), "%.0f", valor);
              lv_label_set_text(label, tmp);
            } else {
              lv_label_set_text(label, "--");
            }
          };

          float total_operacoes_val =
            id(total_operacoes_trades).has_state() ? id(total_operacoes_trades).state : NAN;
          float total_ganhos_val =
            id(total_ganhos_trades).has_state() ? id(total_ganhos_trades).state : NAN;
          float total_prejuizos_val =
            id(total_prejuizos_trades).has_state() ? id(total_prejuizos_trades).state : NAN;
          float day_trades_val =
            id(day_trades).has_state() ? id(day_trades).state : NAN;
          float swing_trades_val =
            id(swing_trades).has_state() ? id(swing_trades).state : NAN;

          mostrar_inteiro(id(txt_fin_total_operacoes), total_operacoes_val);
          mostrar_inteiro(id(txt_fin_total_ganhos), total_ganhos_val);
          mostrar_inteiro(id(txt_fin_total_prejuizos), total_prejuizos_val);
          mostrar_inteiro(id(txt_fin_day_trades), day_trades_val);
          mostrar_inteiro(id(txt_fin_swing_trades), swing_trades_val);

          // ---------- NERDMINER HOME ----------
          bool nerd_online_home = id(nerd_online).has_state() && id(nerd_online).state;
          float nerd_hr_home = id(nerd_hashrate).has_state() ? id(nerd_hashrate).state : -1.0f;
          if (nerd_online_home) {
            if (nerd_hr_home >= 0) snprintf(buf, sizeof(buf), "NERDMINER\nONLINE\n%.0f KH/s", nerd_hr_home);
            else snprintf(buf, sizeof(buf), "NERDMINER\nONLINE\n-- KH/s");
            lv_obj_set_style_bg_color(id(btn_home_nerdminer), lv_color_hex(0x2E7D32), LV_PART_MAIN);
          } else {
            snprintf(buf, sizeof(buf), "NERDMINER\nOFFLINE\n-- KH/s");
            lv_obj_set_style_bg_color(id(btn_home_nerdminer), lv_color_hex(0x546E7A), LV_PART_MAIN);
          }
          lv_label_set_text(id(txt_home_nerdminer), buf);

          // ---------- PAGINA CLIMA ----------
          float tq = id(temp_quarto).has_state() ? id(temp_quarto).state : -1.0f;
          float uq = id(umid_quarto).has_state() ? id(umid_quarto).state : -1.0f;
          float ts = id(temp_sala).has_state() ? id(temp_sala).state : -1.0f;
          float us = id(umid_sala).has_state() ? id(umid_sala).state : -1.0f;
          float tv = id(temp_quintal).has_state() ? id(temp_quintal).state : -1.0f;
          float uv = id(umid_quintal).has_state() ? id(umid_quintal).state : -1.0f;
          float pv = id(press_quintal).has_state() ? id(press_quintal).state : -1.0f;

          std::string clima = id(clima_casa).has_state() ? id(clima_casa).state : "";
          const char* clima_pt = "SEM DADOS";
          if (clima == "clear-night") clima_pt = "NOITE LIMPA";
          else if (clima == "clear") clima_pt = "CÉU LIMPO";
          else if (clima == "partlycloudy") clima_pt = "PARCIALMENTE NUBLADO";
          else if (clima == "cloudy") clima_pt = "NUBLADO";
          else if (clima == "rainy") clima_pt = "CHUVOSO";
          else if (clima == "pouring") clima_pt = "CHUVA FORTE";
          else if (clima == "lightning") clima_pt = "TEMPESTADE";
          else if (clima == "lightning-rainy") clima_pt = "TEMPESTADE COM CHUVA";
          else if (clima == "fog") clima_pt = "NEBLINA";
          else if (clima == "windy" || clima == "windy-variant") clima_pt = "VENTOSO";
          else if (clima == "hail") clima_pt = "GRANIZO";
          else if (clima == "snowy") clima_pt = "NEVE";
          else if (clima == "snowy-rainy") clima_pt = "NEVE E CHUVA";
          else if (clima == "exceptional") clima_pt = "CONDIÇÃO ESPECIAL";

          char temp_ext[32];
          if (tv >= 0) snprintf(temp_ext, sizeof(temp_ext), "%.1f °C", tv);
          else snprintf(temp_ext, sizeof(temp_ext), "--.- °C");
          lv_label_set_text(id(txt_clima_cidade), clima_pt);
          lv_label_set_text(id(txt_clima_exterior), temp_ext);

          if (ts >= 0 && us >= 0) snprintf(buf, sizeof(buf), "SALA  %.1f°C | %.0f%%", ts, us);
          else snprintf(buf, sizeof(buf), "SALA  --.-°C | --%%");
          lv_label_set_text(id(txt_clima_sala), buf);

          if (tq >= 0 && uq >= 0) snprintf(buf, sizeof(buf), "QUARTO  %.1f°C | %.0f%%", tq, uq);
          else snprintf(buf, sizeof(buf), "QUARTO  --.-°C | --%%");
          lv_label_set_text(id(txt_clima_quarto), buf);

          if (tv >= 0 && uv >= 0) snprintf(buf, sizeof(buf), "%.1f°C | %.0f%%", tv, uv);
          else snprintf(buf, sizeof(buf), "--.-°C | --%%");
          lv_label_set_text(id(txt_clima_quintal_detalhe), buf);

          if (pv >= 0) snprintf(buf, sizeof(buf), "%.0f hPa", pv);
          else snprintf(buf, sizeof(buf), "-- hPa");
          lv_label_set_text(id(txt_clima_quintal_pressao), buf);

          float bs = id(bat_sensor_sala).has_state() ? id(bat_sensor_sala).state : -1.0f;
          float bq = id(bat_sensor_quarto).has_state() ? id(bat_sensor_quarto).state : -1.0f;
          if (bs >= 0 && bq >= 0) snprintf(buf, sizeof(buf), "SALA %.0f%% | QUARTO %.0f%%", bs, bq);
          else snprintf(buf, sizeof(buf), "SALA --%% | QUARTO --%%");
          lv_label_set_text(id(txt_bat_sensores), buf);

          auto conforto = [](float t, float u) -> const char* {
            if (t >= 0 && t < 21.0f) return "FRIO";
            if (t > 27.0f) return "QUENTE";
            if (u >= 0 && u < 40.0f) return "SECO";
            if (u > 70.0f) return "UMIDO";
            return "CONFORTAVEL";
          };

          const char* conf_sala = conforto(ts, us);
          const char* conf_quarto = conforto(tq, uq);
          lv_label_set_text(id(txt_clima_sala_conforto), conf_sala);
          lv_label_set_text(id(txt_clima_quarto_conforto), conf_quarto);

          lv_obj_set_style_text_color(
            id(txt_clima_sala_conforto),
            lv_color_hex(strcmp(conf_sala, "CONFORTAVEL") == 0 ? 0x76FF03 : 0xFFC107),
            LV_PART_MAIN
          );
          lv_obj_set_style_text_color(
            id(txt_clima_quarto_conforto),
            lv_color_hex(strcmp(conf_quarto, "CONFORTAVEL") == 0 ? 0x76FF03 : 0xFFC107),
            LV_PART_MAIN
          );

          // ---------- PAGINA NERDMINER ----------
          bool nerd_on = id(nerd_online).has_state() && id(nerd_online).state;
          std::string nerd_st = id(nerd_status).has_state() ? id(nerd_status).state : "--";
          std::string nerd_pl = id(nerd_pool).has_state() ? id(nerd_pool).state : "--";
          std::string nerd_ip_s = id(nerd_ip).has_state() ? id(nerd_ip).state : "--";
          std::string nerd_boot = id(nerd_ultimo_boot).has_state() ? id(nerd_ultimo_boot).state : "--";
          std::string nerd_chip_s = id(nerd_chip).has_state() ? id(nerd_chip).state : "--";
          snprintf(buf, sizeof(buf), "STATUS: %s", nerd_st.c_str());
          lv_label_set_text(id(txt_nerd_status), buf);
          lv_obj_set_style_text_color(id(txt_nerd_status), lv_color_hex(nerd_on ? 0x76FF03 : 0xEF5350), LV_PART_MAIN);
          lv_label_set_text(id(txt_nerd_online), nerd_on ? "ONLINE" : "OFFLINE");
          lv_obj_set_style_text_color(id(txt_nerd_online), lv_color_hex(nerd_on ? 0x76FF03 : 0xEF5350), LV_PART_MAIN);
          snprintf(buf, sizeof(buf), "POOL: %s", nerd_pl.c_str());
          lv_label_set_text(id(txt_nerd_pool), buf);
          if (id(nerd_hashrate).has_state()) snprintf(buf, sizeof(buf), "%.0f KH/s", id(nerd_hashrate).state); else snprintf(buf, sizeof(buf), "--- KH/s");
          lv_label_set_text(id(txt_nerd_hashrate), buf);
          if (id(nerd_shares).has_state()) snprintf(buf, sizeof(buf), "%.0f", id(nerd_shares).state); else snprintf(buf, sizeof(buf), "---");
          lv_label_set_text(id(txt_nerd_shares), buf);
          if (id(nerd_blocos_validos).has_state()) snprintf(buf, sizeof(buf), "%.0f", id(nerd_blocos_validos).state); else snprintf(buf, sizeof(buf), "--");
          lv_label_set_text(id(txt_nerd_blocos), buf);
          if (id(nerd_melhor_dificuldade).has_state()) snprintf(buf, sizeof(buf), "%.3e", id(nerd_melhor_dificuldade).state); else snprintf(buf, sizeof(buf), "--");
          lv_label_set_text(id(txt_nerd_dificuldade), buf);
          unsigned long nus = id(nerd_uptime).has_state() ? (unsigned long)id(nerd_uptime).state : 0UL;
          unsigned long nd = nus / 86400UL, nh = (nus % 86400UL) / 3600UL, nm = (nus % 3600UL) / 60UL, nsx = nus % 60UL;
          float nt = id(nerd_templates).has_state() ? id(nerd_templates).state : -1.0f;
          float nw = id(nerd_wifi_rssi).has_state() ? id(nerd_wifi_rssi).state : -999.0f;
          float nr = id(nerd_memoria_livre).has_state() ? id(nerd_memoria_livre).state / 1024.0f : -1.0f;
          float nc = id(nerd_cpu).has_state() ? id(nerd_cpu).state : -1.0f;
          float nf = id(nerd_flash).has_state() ? id(nerd_flash).state : -1.0f;
          float nhp = id(nerd_heap_livre_sistema).has_state() ? id(nerd_heap_livre_sistema).state / 1024.0f : -1.0f;
          float nhm = id(nerd_heap_minimo).has_state() ? id(nerd_heap_minimo).state / 1024.0f : -1.0f;
          if (id(nerd_uptime).has_state()) snprintf(buf, sizeof(buf), "UPTIME: %lud %02luh %02lum %02lus\nTEMPLATES: %.0f   WI-FI: %.0f dBm   RAM: %.0f KB\nCPU: %.0f MHz (%s)   FLASH: %.1f MB   IP: %s\nHEAP: %.0f KB   MÍN. HEAP: %.0f KB\nBOOT: %s", nd, nh, nm, nsx, nt, nw, nr, nc, nerd_chip_s.c_str(), nf, nerd_ip_s.c_str(), nhp, nhm, nerd_boot.c_str());
          else snprintf(buf, sizeof(buf), "UPTIME: --\nTEMPLATES: %.0f   WI-FI: %.0f dBm   RAM: %.0f KB\nCPU: %.0f MHz (%s)   FLASH: %.1f MB   IP: %s\nHEAP: %.0f KB   MÍN. HEAP: %.0f KB\nBOOT: %s", nt, nw, nr, nc, nerd_chip_s.c_str(), nf, nerd_ip_s.c_str(), nhp, nhm, nerd_boot.c_str());
          lv_label_set_text(id(txt_nerd_operacao), buf);

          // ---------- PAGINA ILUMINACAO ----------
          bool rgb_on =
            id(estado_luz_rgb).has_state() &&
            id(estado_luz_rgb).state == "on";

          bool banheiro_on =
            id(estado_luz_banheiro).has_state() &&
            id(estado_luz_banheiro).state == "on";

          bool escritorio_on =
            id(estado_luz_escritorio).has_state() &&
            id(estado_luz_escritorio).state == "on";

          bool cozinha_on =
            id(estado_cozinha).has_state() &&
            id(estado_cozinha).state == "on";

          bool varanda_int_on =
            id(estado_varanda_interna).has_state() &&
            id(estado_varanda_interna).state == "on";

          bool varanda_ext_on =
            id(estado_varanda_externa).has_state() &&
            id(estado_varanda_externa).state == "on";

          lv_label_set_text(
            id(txt_rgb_estado),
            rgb_on ? "LUZ BRANCA: LIGADA" : "LUZ BRANCA: DESLIGADA"
          );

          // ---------- ICONES DAS LAMPADAS ----------
          if (banheiro_on) {
            lv_obj_clear_flag(id(img_lamp_banheiro_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(img_lamp_banheiro_off), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(img_lamp_banheiro_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(img_lamp_banheiro_off), LV_OBJ_FLAG_HIDDEN);
          }

          if (cozinha_on) {
            lv_obj_clear_flag(id(img_lamp_cozinha_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(img_lamp_cozinha_off), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(img_lamp_cozinha_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(img_lamp_cozinha_off), LV_OBJ_FLAG_HIDDEN);
          }

          if (escritorio_on) {
            lv_obj_clear_flag(id(img_lamp_escritorio_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(img_lamp_escritorio_off), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(img_lamp_escritorio_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(img_lamp_escritorio_off), LV_OBJ_FLAG_HIDDEN);
          }

          if (varanda_int_on) {
            lv_obj_clear_flag(id(img_lamp_varanda_interna_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(img_lamp_varanda_interna_off), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(img_lamp_varanda_interna_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(img_lamp_varanda_interna_off), LV_OBJ_FLAG_HIDDEN);
          }

          if (varanda_ext_on) {
            lv_obj_clear_flag(id(img_lamp_varanda_externa_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(img_lamp_varanda_externa_off), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(img_lamp_varanda_externa_on), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(img_lamp_varanda_externa_off), LV_OBJ_FLAG_HIDDEN);
          }

          lv_label_set_text(id(txt_btn_banheiro), "BANHEIRO");

          lv_label_set_text(id(txt_btn_escritorio), "ESCRITORIO");

          lv_label_set_text(id(txt_btn_cozinha), "COZINHA");

          lv_label_set_text(id(txt_btn_varanda_interna), "VARANDA INT");

          lv_label_set_text(id(txt_btn_varanda_externa), "VARANDA EXT");

          lv_obj_set_style_bg_color(
            id(card_gateway_rgb),
            lv_color_hex(rgb_on ? 0xFFB300 : 0x1565C0),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_rgb_power_on),
            lv_color_hex(rgb_on ? 0x66BB6A : 0x2E7D32),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_rgb_power_off),
            lv_color_hex(rgb_on ? 0xB71C1C : 0x616161),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_luz_banheiro),
            lv_color_hex(banheiro_on ? 0xFFB300 : 0x1565C0),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_luz_escritorio),
            lv_color_hex(escritorio_on ? 0xFFB300 : 0x1565C0),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_luz_cozinha),
            lv_color_hex(cozinha_on ? 0xFFB300 : 0x1565C0),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_luz_varanda_interna),
            lv_color_hex(varanda_int_on ? 0xFFB300 : 0x1565C0),
            LV_PART_MAIN
          );

          lv_obj_set_style_bg_color(
            id(btn_luz_varanda_externa),
            lv_color_hex(varanda_ext_on ? 0xFFB300 : 0x1565C0),
            LV_PART_MAIN
          );

          // ---------- PAGINA CLIMATIZACAO ----------
          bool fs = id(estado_fan_sala).has_state() && id(estado_fan_sala).state == "on";
          bool fq = id(estado_fan_quarto).has_state() && id(estado_fan_quarto).state == "on";

          float fps = id(fan_sala_percent).has_state() ? atof(id(fan_sala_percent).state.c_str()) : 0.0f;
          float fpq = id(fan_quarto_percent).has_state() ? atof(id(fan_quarto_percent).state.c_str()) : 0.0f;

          if (fps < 0) fps = 0;
          if (fps > 100) fps = 100;
          if (fpq < 0) fpq = 0;
          if (fpq > 100) fpq = 100;

          char fan_sala_text[64];
          snprintf(fan_sala_text, sizeof(fan_sala_text), "VENTILADOR SALA | %s | %.0f%%", fs ? "ON" : "OFF", fps);
          lv_label_set_text(id(txt_fan_sala), fan_sala_text);

          char fan_quarto_text[64];
          snprintf(fan_quarto_text, sizeof(fan_quarto_text), "VENTILADOR QUARTO | %s | %.0f%%", fq ? "ON" : "OFF", fpq);
          lv_label_set_text(id(txt_fan_quarto), fan_quarto_text);

          lv_obj_set_style_bg_color(id(btn_fan_sala),
            lv_color_hex(fs ? 0x1976D2 : 0x455A64), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_fan_quarto),
            lv_color_hex(fq ? 0x1976D2 : 0x455A64), LV_PART_MAIN);

          char fan_buf[40];
          snprintf(fan_buf, sizeof(fan_buf), "VELOCIDADE: %.0f%%", fps);
          lv_label_set_text(id(txt_fan_sala_percent), fan_buf);
          snprintf(fan_buf, sizeof(fan_buf), "VELOCIDADE: %.0f%%", fpq);
          lv_label_set_text(id(txt_fan_quarto_percent), fan_buf);

          int slider_sala = (int) roundf(fps);
          int slider_quarto = (int) roundf(fpq);
          if (slider_sala < 1) slider_sala = 1;
          if (slider_sala > 100) slider_sala = 100;
          if (slider_quarto < 1) slider_quarto = 1;
          if (slider_quarto > 100) slider_quarto = 100;

          if (!lv_obj_has_state(id(slider_fan_sala), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(slider_fan_sala)) != slider_sala) {
            lv_slider_set_value(id(slider_fan_sala), slider_sala, LV_ANIM_OFF);
          }
          if (!lv_obj_has_state(id(slider_fan_quarto), LV_STATE_PRESSED) &&
              lv_slider_get_value(id(slider_fan_quarto)) != slider_quarto) {
            lv_slider_set_value(id(slider_fan_quarto), slider_quarto, LV_ANIM_OFF);
          }
